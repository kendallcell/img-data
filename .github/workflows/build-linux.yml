name: Build Linux Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build standalone executable
        run: |
          pyinstaller \
            --onefile \
            --name img-data-linux-x86_64 \
            img_data_launcher.py

      - name: Test executable help
        run: |
          ./dist/img-data-linux-x86_64 --help

      - name: Test executable inspection
        run: |
          ./dist/img-data-linux-x86_64 inspect tests/data/Attorney1.png

      - name: Test executable stripping
        run: |
          cp tests/data/Attorney2.png /tmp/Attorney2.png
          ./dist/img-data-linux-x86_64 strip --all /tmp/Attorney2.png
          ./dist/img-data-linux-x86_64 inspect /tmp/Attorney2-All-Stripped.png

      - name: Show executable details
        run: |
          ls -lh dist/img-data-linux-x86_64
          file dist/img-data-linux-x86_64

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: img-data-linux-x86_64
          path: dist/img-data-linux-x86_64
          if-no-files-found: error