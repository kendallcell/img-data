name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .

      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name img-data-windows-x86_64 `
            img_data_launcher.py

      - name: Test executable help
        shell: pwsh
        run: |
          .\dist\img-data-windows-x86_64.exe --help

      - name: Test executable inspection
        shell: pwsh
        run: |
          .\dist\img-data-windows-x86_64.exe inspect tests\data\Attorney1.png

      - name: Test executable stripping
        shell: pwsh
        run: |
          Copy-Item tests\data\Attorney2.png $env:TEMP\Attorney2.png
          .\dist\img-data-windows-x86_64.exe strip --all $env:TEMP\Attorney2.png
          .\dist\img-data-windows-x86_64.exe inspect $env:TEMP\Attorney2-All-Stripped.png

      - name: Show executable details
        shell: pwsh
        run: |
          Get-Item .\dist\img-data-windows-x86_64.exe |
            Format-List Name, Length, FullName

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: img-data-windows-x86_64
          path: dist/img-data-windows-x86_64.exe
          if-no-files-found: error