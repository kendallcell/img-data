[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "img-data"
version = "0.1.0"
description = "Inspect and remove metadata from AI generated images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
]

[project.scripts]
img-data = "img_data.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
